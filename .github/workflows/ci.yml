name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tqms
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: tqms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tqms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tqms:ci_only_password@localhost:5432/tqms_test
      E2E_DATABASE_URL: postgres://tqms:ci_only_password@localhost:5432/tqms_e2e
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils postgresql-client
      - run: psql -h localhost -U tqms -d tqms_test -c 'CREATE DATABASE tqms_e2e'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            var/report-samples
            var/screenshots
            test-results
          if-no-files-found: ignore
